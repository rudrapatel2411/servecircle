      body {

        border: 1px solid rgba(255, 255, 255, 0.92);

      .app-loader-icon {

      }
      .app-loader-bar {
        width: 150px;
        height: 4px;
        background: rgba(22, 70, 214, 0.12);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      .app-loader-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 42%;
        background: linear-gradient(90deg, #4C86FF, #1646D6);
        border-radius: 9999px;

      @keyframes appLoaderSlide {

      }
